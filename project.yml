# XcodeGen project spec for the LunaAnime SwiftUI iOS app.
# Modeled on cranci1/Luna's project settings (bundle ID `me.cranci.sigma6741`,
# scheme `Luna`, IPHONEOS_DEPLOYMENT_TARGET `16.0`, all device families).
# Run `xcodegen generate` in CI before invoking ipabuild.sh.

name: Luna
options:
  bundleIdPrefix: me.cranci
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    TARGETED_DEVICE_FAMILY: "1,2,3"

targets:
  Luna:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LunaAnime
        excludes:
          - "**/*.md"
    info:
      path: LunaAnime/App/Info.plist
    settings:
      base:
        PRODUCT_NAME: Luna
        PRODUCT_BUNDLE_IDENTIFIER: me.cranci.sigma6741
        TARGETED_DEVICE_FAMILY: "1,2,3"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LunaAnime/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Adhoc signing for SideStore re-sign.
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        PROVISIONING_PROFILE_SPECIFIER: ""
        DEVELOPMENT_TEAM: ""
        SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreData.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: BackgroundTasks.framework

# Schemes live at the TOP LEVEL of the project spec, not under targets/.
# (Previous version nested them under `targets:` which made XcodeGen parse
# `schemes` as a second target with no platform, hence "Unknown Target
# platform:" failure.)
schemes:
  Luna:
    build:
      targets:
        Luna: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
    test:
      config: Debug
