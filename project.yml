# XcodeGen project spec for LunaRyu (the LunaAnime iOS app).
# Run `xcodegen generate` to materialize LunaRyu.xcodeproj from this file.
# The .xcodeproj itself is intentionally NOT committed.

name: LunaRyu
options:
  bundleIdPrefix: app.lunaRyu
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  LunaRyu:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LunaAnime
        excludes:
          - "**/*.md"
    info:
      path: LunaAnime/App/Info.plist
    settings:
      base:
        PRODUCT_NAME: LunaRyu
        PRODUCT_BUNDLE_IDENTIFIER: app.lunaRyu.ios
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LunaAnime/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Adhoc signing for SideStore re-sign.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        PROVISIONING_PROFILE_SPECIFIER: ""
        DEVELOPMENT_TEAM: ""
        # Friendlier binary for an iPhone SE.
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_COMPILATION_MODE: wholemodule
        DEAD_CODE_STRIPPING: YES
        VALIDATE_PRODUCT: NO
    dependencies:
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreData.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: BackgroundTasks.framework
